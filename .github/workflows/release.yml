name: Release Multi-Platform Installers & Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/llmzip
            cdylib: target/x86_64-unknown-linux-gnu/release/libllmzip_ffi.so
            platform: linux

          - os: macos-latest
            target: aarch64-apple-darwin
            name: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/llmzip
            cdylib: target/aarch64-apple-darwin/release/libllmzip_ffi.dylib
            platform: macos

          - os: macos-13
            target: x86_64-apple-darwin
            name: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/llmzip
            cdylib: target/x86_64-apple-darwin/release/libllmzip_ffi.dylib
            platform: macos

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            binary: target/x86_64-pc-windows-msvc/release/llmzip.exe
            cdylib: target/x86_64-pc-windows-msvc/release/llmzip_ffi.dll
            platform: windows

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            name: windows-arm64
            binary: target/aarch64-pc-windows-msvc/release/llmzip.exe
            cdylib: target/aarch64-pc-windows-msvc/release/llmzip_ffi.dll
            platform: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build -p llmzip-cli -p llmzip-ffi --release --target ${{ matrix.target }}

      # Linux Packaging (tar.gz + .deb installer)
      - name: Package Linux
        if: ${{ matrix.platform == 'linux' }}
        run: |
          RAW_TAG="${GITHUB_REF_NAME:-v0.2.0}"
          CLEAN_VER="${RAW_TAG#v}"
          
          mkdir -p dist_staging/bin dist_staging_c
          cp ${{ matrix.binary }} dist_staging/
          tar -czf "llmzip-${RAW_TAG}-${{ matrix.name }}.tar.gz" -C dist_staging llmzip
          
          mkdir -p dist_staging_c/include dist_staging_c/lib
          cp include/llmzip.h dist_staging_c/include/
          cp ${{ matrix.cdylib }} dist_staging_c/lib/
          tar -czf "llmzip-c-api-${RAW_TAG}-${{ matrix.name }}.tar.gz" -C dist_staging_c include lib
          
          chmod +x packaging/linux/make_deb.sh
          ./packaging/linux/make_deb.sh "$CLEAN_VER"

      # macOS Packaging (tar.gz + .pkg installer)
      - name: Package macOS
        if: ${{ matrix.platform == 'macos' }}
        run: |
          RAW_TAG="${GITHUB_REF_NAME:-v0.2.0}"
          CLEAN_VER="${RAW_TAG#v}"
          
          mkdir -p dist_staging/bin dist_staging_c
          cp ${{ matrix.binary }} dist_staging/
          tar -czf "llmzip-${RAW_TAG}-${{ matrix.name }}.tar.gz" -C dist_staging llmzip
          
          mkdir -p dist_staging_c/include dist_staging_c/lib
          cp include/llmzip.h dist_staging_c/include/
          cp ${{ matrix.cdylib }} dist_staging_c/lib/
          tar -czf "llmzip-c-api-${RAW_TAG}-${{ matrix.name }}.tar.gz" -C dist_staging_c include lib
          
          chmod +x packaging/macos/make_pkg.sh
          ./packaging/macos/make_pkg.sh "${{ matrix.target }}" "$CLEAN_VER"

      # Windows Packaging (zip + NSIS .exe setup)
      - name: Package Windows
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          $rawTag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v0.2.0" }
          $cleanVer = $rawTag.TrimStart('v')
          
          New-Item -ItemType Directory -Path dist_staging -Force | Out-Null
          Copy-Item "${{ matrix.binary }}" -Destination dist_staging\llmzip.exe
          Compress-Archive -Path dist_staging\llmzip.exe -DestinationPath "llmzip-$rawTag-${{ matrix.name }}.zip" -Force
          
          New-Item -ItemType Directory -Path dist_staging_c\include -Force | Out-Null
          New-Item -ItemType Directory -Path dist_staging_c\lib -Force | Out-Null
          Copy-Item "include\llmzip.h" -Destination dist_staging_c\include\llmzip.h
          Copy-Item "${{ matrix.cdylib }}" -Destination dist_staging_c\lib\llmzip_ffi.dll
          Compress-Archive -Path dist_staging_c\* -DestinationPath "llmzip-c-api-$rawTag-${{ matrix.name }}.zip" -Force
          
          choco install nsis -y
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          $installerName = "llmzip-$rawTag-${{ matrix.name }}-setup.exe"
          if (Test-Path $makensis) {
            & $makensis "/DOUT_FILE=$installerName" "/DPRODUCT_VERSION=$cleanVer" packaging\windows\installer.nsi
          } else {
            Write-Warning "NSIS not found at standard path, skipping .exe setup"
          }
          $LASTEXITCODE = 0
          
      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            llmzip-*
            *.deb
            *.pkg
            *-setup.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
