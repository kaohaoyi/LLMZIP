name: Release Multi-Platform Installers & Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: llmzip-v0.1.0-x86_64-unknown-linux-gnu.tar.gz
            c_artifact: llmzip-c-api-v0.1.0-x86_64-unknown-linux-gnu.tar.gz
            installer: llmzip_0.1.0_amd64.deb
            binary: target/x86_64-unknown-linux-gnu/release/llmzip
            cdylib: target/x86_64-unknown-linux-gnu/release/libllmzip_ffi.so
            platform: linux

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: llmzip-v0.1.0-aarch64-apple-darwin.tar.gz
            c_artifact: llmzip-c-api-v0.1.0-aarch64-apple-darwin.tar.gz
            installer: llmzip-0.1.0-aarch64-apple-darwin.pkg
            binary: target/aarch64-apple-darwin/release/llmzip
            cdylib: target/aarch64-apple-darwin/release/libllmzip_ffi.dylib
            platform: macos

          - os: macos-13
            target: x86_64-apple-darwin
            artifact: llmzip-v0.1.0-x86_64-apple-darwin.tar.gz
            c_artifact: llmzip-c-api-v0.1.0-x86_64-apple-darwin.tar.gz
            installer: llmzip-0.1.0-x86_64-apple-darwin.pkg
            binary: target/x86_64-apple-darwin/release/llmzip
            cdylib: target/x86_64-apple-darwin/release/libllmzip_ffi.dylib
            platform: macos

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: llmzip-v0.1.0-windows-x64.zip
            c_artifact: llmzip-c-api-v0.1.0-windows-x64.zip
            installer: llmzip-v0.1.0-windows-x64-setup.exe
            binary: target/x86_64-pc-windows-msvc/release/llmzip.exe
            cdylib: target/x86_64-pc-windows-msvc/release/llmzip_ffi.dll
            platform: windows

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: llmzip-v0.1.0-windows-arm64.zip
            c_artifact: llmzip-c-api-v0.1.0-windows-arm64.zip
            installer: llmzip-v0.1.0-windows-arm64-setup.exe
            binary: target/aarch64-pc-windows-msvc/release/llmzip.exe
            cdylib: target/aarch64-pc-windows-msvc/release/llmzip_ffi.dll
            platform: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build -p llmzip-cli -p llmzip-ffi --release --target ${{ matrix.target }}

      # Linux Packaging (tar.gz + .deb installer)
      - name: Package Linux
        if: ${{ matrix.platform == 'linux' }}
        run: |
          mkdir -p dist_staging/bin dist_staging_c
          cp ${{ matrix.binary }} dist_staging/
          tar -czf ${{ matrix.artifact }} -C dist_staging llmzip
          
          mkdir -p dist_staging_c/include dist_staging_c/lib
          cp include/llmzip.h dist_staging_c/include/
          cp ${{ matrix.cdylib }} dist_staging_c/lib/
          tar -czf ${{ matrix.c_artifact }} -C dist_staging_c include lib
          
          chmod +x packaging/linux/make_deb.sh
          ./packaging/linux/make_deb.sh

      # macOS Packaging (tar.gz + .pkg installer)
      - name: Package macOS
        if: ${{ matrix.platform == 'macos' }}
        run: |
          mkdir -p dist_staging/bin dist_staging_c
          cp ${{ matrix.binary }} dist_staging/
          tar -czf ${{ matrix.artifact }} -C dist_staging llmzip
          
          mkdir -p dist_staging_c/include dist_staging_c/lib
          cp include/llmzip.h dist_staging_c/include/
          cp ${{ matrix.cdylib }} dist_staging_c/lib/
          tar -czf ${{ matrix.c_artifact }} -C dist_staging_c include lib
          
          chmod +x packaging/macos/make_pkg.sh
          ./packaging/macos/make_pkg.sh ${{ matrix.target }}

      # Windows Packaging (zip + NSIS .exe setup)
      - name: Package Windows
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist_staging -Force | Out-Null
          Copy-Item "${{ matrix.binary }}" -Destination dist_staging\llmzip.exe
          Compress-Archive -Path dist_staging\llmzip.exe -DestinationPath ${{ matrix.artifact }} -Force
          
          New-Item -ItemType Directory -Path dist_staging_c\include -Force | Out-Null
          New-Item -ItemType Directory -Path dist_staging_c\lib -Force | Out-Null
          Copy-Item "include\llmzip.h" -Destination dist_staging_c\include\llmzip.h
          Copy-Item "${{ matrix.cdylib }}" -Destination dist_staging_c\lib\llmzip_ffi.dll
          Compress-Archive -Path dist_staging_c\* -DestinationPath ${{ matrix.c_artifact }} -Force
          
          choco install nsis -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          makensis /DOUT_FILE=${{ matrix.installer }} packaging\windows\installer.nsi || echo "NSIS build optional fallback"
          
      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.artifact }}
            ${{ matrix.c_artifact }}
            ${{ matrix.installer }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
