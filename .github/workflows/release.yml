name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: llmzip-v0.1.0-x86_64-unknown-linux-gnu.tar.gz
            c_artifact: llmzip-c-api-v0.1.0-x86_64-unknown-linux-gnu.tar.gz
            binary: target/x86_64-unknown-linux-gnu/release/llmzip
            cdylib: target/x86_64-unknown-linux-gnu/release/libllmzip_ffi.so
            is_windows: false

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: llmzip-v0.1.0-aarch64-apple-darwin.tar.gz
            c_artifact: llmzip-c-api-v0.1.0-aarch64-apple-darwin.tar.gz
            binary: target/aarch64-apple-darwin/release/llmzip
            cdylib: target/aarch64-apple-darwin/release/libllmzip_ffi.dylib
            is_windows: false

          - os: macos-13
            target: x86_64-apple-darwin
            artifact: llmzip-v0.1.0-x86_64-apple-darwin.tar.gz
            c_artifact: llmzip-c-api-v0.1.0-x86_64-apple-darwin.tar.gz
            binary: target/x86_64-apple-darwin/release/llmzip
            cdylib: target/x86_64-apple-darwin/release/libllmzip_ffi.dylib
            is_windows: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: llmzip-v0.1.0-windows-x64.zip
            c_artifact: llmzip-c-api-v0.1.0-windows-x64.zip
            binary: target/x86_64-pc-windows-msvc/release/llmzip.exe
            cdylib: target/x86_64-pc-windows-msvc/release/llmzip_ffi.dll
            is_windows: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package artifacts (Unix)
        if: ${{ !matrix.is_windows }}
        run: |
          mkdir -p dist_staging/bin dist_staging_c
          cp ${{ matrix.binary }} dist_staging/
          tar -czf ${{ matrix.artifact }} -C dist_staging llmzip
          
          mkdir -p dist_staging_c/include dist_staging_c/lib
          cp include/llmzip.h dist_staging_c/include/
          cp ${{ matrix.cdylib }} dist_staging_c/lib/
          tar -czf ${{ matrix.c_artifact }} -C dist_staging_c include lib

      - name: Package artifacts (Windows)
        if: ${{ matrix.is_windows }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist_staging -Force | Out-Null
          Copy-Item "${{ matrix.binary }}" -Destination dist_staging\llmzip.exe
          Compress-Archive -Path dist_staging\llmzip.exe -DestinationPath ${{ matrix.artifact }} -Force
          
          New-Item -ItemType Directory -Path dist_staging_c\include -Force | Out-Null
          New-Item -ItemType Directory -Path dist_staging_c\lib -Force | Out-Null
          Copy-Item "include\llmzip.h" -Destination dist_staging_c\include\llmzip.h
          Copy-Item "${{ matrix.cdylib }}" -Destination dist_staging_c\lib\llmzip_ffi.dll
          Compress-Archive -Path dist_staging_c\* -DestinationPath ${{ matrix.c_artifact }} -Force

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.artifact }}
            ${{ matrix.c_artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
