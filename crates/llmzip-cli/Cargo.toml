[package]
name = "llmzip-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[lib]
name = "llmzip_cli"
path = "src/lib.rs"

[[bin]]
name = "llmzip"
path = "src/main.rs"

[dependencies]
llmzip-core.workspace = true
serde_json.workspace = true
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
